name: ravens-ci

# Manual-only (RM-002): this workflow runs ONLY when a human dispatches it
# from the Actions tab. It never fires on push, pull_request, schedule, or
# any other automatic trigger — Volmarr's standing rule for all his repos.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: muninn + huginn suites (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # RM-007 test matrix: every supported Python, each job named
        # per version; fail-fast is false so one version's failure
        # never hides another version's result.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install both packages from this repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./muninn ./huginn "pytest>=7,<10"

      - name: Install lint/type/coverage tools (RM-008/RM-009 floors, dev-only)
        run: python -m pip install "ruff>=0.6,<1" "mypy>=1.11,<2" "coverage>=7,<8"

      - name: Lint both packages (ruff — RM-008 floor)
        run: |
          ruff check muninn/src muninn/tests muninn/scripts
          ruff check huginn/src huginn/tests huginn/scripts

      - name: Type-check muninn (mypy — RM-008 ratchet level 1)
        working-directory: muninn
        run: python -m mypy src/muninn

      - name: Type-check huginn (mypy — RM-008 ratchet level 1)
        working-directory: huginn
        run: python -m mypy src/huginn

      - name: Coverage muninn (RM-009 floor — report fails under 88%)
        working-directory: muninn
        run: |
          python -m coverage run -m pytest tests -q
          python -m coverage report

      - name: Coverage huginn (RM-009 floor — report fails under 88%)
        working-directory: huginn
        run: |
          python -m coverage run -m pytest tests -q
          python -m coverage report

      - name: Run the muninn suite (installed package)
        run: python -m pytest muninn/tests -q

      - name: Run the huginn suite (installed package)
        run: python -m pytest huginn/tests -q

  dependency-scan:
    name: dependency vulnerability scan (RM-052)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit (bounded — RM-052 dependency law)
        run: python -m pip install "pip-audit>=2.7,<3"

      - name: Scan the lockfile example (RM-052)
        run: python -m pip_audit -r docs/examples/requirements-lock.example.txt

      # The embeddings extra is not installed here: sentence-transformers
      # pulls a torch-scale tree. Its spec stays bounded in huginn's
      # pyproject (pinned by tests/test_dependency_hygiene.py) and a host
      # that uses it scans it by the lockfile road in
      # docs/DEPENDENCY_HYGIENE.md.
      - name: Scan the installed runtime + dev environment (RM-052)
        run: |
          python -m pip install "./muninn[encryption,dev]" "./huginn[encryption,qdrant,dev]"
          python -m pip_audit
