[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "huginn"
version = "1.0.0"
description = "Huginn — the Thought Raven: semantic retrieval over your memories. Qdrant when available, a fully capable local TF-IDF store when not; never crashes the caller over a missing server"
readme = "INTERFACE.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Volmarr Wyrd" }]
dependencies = []

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.9,<2"]
embeddings = ["sentence-transformers>=2.2,<6"]
dev = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
